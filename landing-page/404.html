  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', Arial, sans-serif; background: #0D1F0E; color: #FFFFFF; margin: 0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .wrap { max-width: 480px; padding: 0 24px; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 0.06em; color: #FFFFFF; margin-bottom: 28px; }
    .logo span { color: #D4FF00; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 44px; letter-spacing: 0.02em; color: #FFFFFF; margin: 0 0 10px; }
    p { color: #8A9E8B; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
    a.btn { display: inline-block; background: #D4FF00; color: #0D1F0E; padding: 12px 24px; margin: 4px;
            border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 14px; }
    a.btn:hover { background: #C0F000; }
    a.btn.ghost { background: transparent; color: #D4FF00; border: 1.5px solid #D4FF00; }
    a.btn.ghost:hover { background: #D4FF00; color: #0D1F0E; }
  </style>
  <script>
    // Certificates, emails and older links point at meridiancpd.co.uk/verify/..., but the
    // verification page, completion links and subscriber dashboard are served by the app
    // at app.meridiancpd.co.uk. Forward those paths so every issued certificate still verifies.
    (function () {
      var APP = 'https://app.meridiancpd.co.uk';
      var path = window.location.pathname;
      var appPaths = ['/verify', '/complete', '/my-cpd', '/download', '/unsubscribe'];
      for (var i = 0; i < appPaths.length; i++) {
        var p = appPaths[i];
        if (path === p || path.indexOf(p + '/') === 0) {
          window.location.replace(APP + path + window.location.search);
          return;
        }
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="logo">MERIDIAN <span>CPD</span></div>
    <h1>Page not found</h1>
    <p>That page doesn't exist. If you're checking a certificate, enter its number on the verification page.</p>
    <a class="btn" href="https://app.meridiancpd.co.uk/verify">Verify a certificate</a>
    <a class="btn ghost" href="https://meridiancpd.co.uk">Home</a>
  </div>
<script src="/consent.js" defer></script>
</body>
</html>
