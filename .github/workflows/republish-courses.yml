name: Meridian CPD — Republish Corrected Courses

# Rebuilds course PDFs and replaces them in storage when a course's markdown changes
# on main, so a merged correction reaches customers without anyone running a script.
# The content engine's own commits carry [skip ci] and publish their own PDF.

on:
  push:
    branches: [main]
    paths:
      - 'courses/MER-*/MER-*.md'
      - 'courses/build_pdfs_v2.py'
  workflow_dispatch:
    inputs:
      course_ids:
        description: 'Course IDs to rebuild, separated by spaces (e.g. MER-DEA-004 MER-DEA-011)'
        required: true

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r content-engine/requirements.txt
          pip install -r webhook/requirements.txt

      - name: Work out which courses changed
        id: changed
        env:
          INPUT_IDS: ${{ github.event.inputs.course_ids }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_IDS" ]; then
            ids="$INPUT_IDS"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qx 'courses/build_pdfs_v2.py'; then
            # The PDF design changed: rebuild every course that is on sale. Withdrawn
            # courses (landing-page/under-review.json) and unregistered ones are left alone.
            ids=$(python3 - <<'PY'
          import json, pathlib, re
          withdrawn = set(json.load(open("landing-page/under-review.json"))["under_review"])
          registered = set(re.findall(r'"course_id": "(MER-[A-Z]+-[0-9]{3})"', pathlib.Path("webhook/main.py").read_text()))
          ids = sorted(d.name for d in pathlib.Path("courses").glob("MER-*")
                       if (d / f"{d.name}.md").exists() and d.name in registered and d.name not in withdrawn)
          print(" ".join(ids))
          PY
            )
          else
            ids=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'courses/MER-*/MER-*.md' \
                  | sed -E 's#^courses/(MER-[A-Z]+-[0-9]{3})/.*#\1#' | sort -u | tr '\n' ' ')
          fi
          echo "Courses: $ids"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Rebuild and replace PDFs
        if: steps.changed.outputs.ids != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COURSE_IDS: ${{ steps.changed.outputs.ids }}
        run: python3 content-engine/republish_courses.py $COURSE_IDS
